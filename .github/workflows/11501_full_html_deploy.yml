name: 🚀 自動外送 11501_full_html 到 11501_full_html

on:
  push:
    branches:
      - main
    paths:
      - '11501_full_html/**'

jobs:
  web-deploy:
    name: 🎉 11501_full_html專屬主機同步
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 步驟1：取得最新程式碼
      uses: actions/checkout@v4

    - name: 🏗️ 步驟2：動態配置專案資料夾結構
      run: |
        rm -rf deploy_temp
        mkdir -p deploy_temp/back_end_learning/11501_full_html/
        rsync -av --exclude='deploy_temp' --exclude='.git' --exclude='.github' ./11501_full_html deploy_temp/back_end_learning/11501_full_html/

    - name: 📂 步驟3：透過 FTP 安全同步到主機
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./deploy_temp/
        server-dir: ./